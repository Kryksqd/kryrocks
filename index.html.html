<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KryRocks GUIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f3fb;--card:#fff;--line:#e0d8ee;--text:#1e1a2b;--muted:#6a6280;--acc:#6d3fc0;--accbg:#ece4fa;
--L:#c47400;--E:#d6247f;--R:#1d6bd0;--U:#11877a;--C:#5c6878}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0914;--card:#161022;--line:#2b2040;--text:#ebe6f5;--muted:#9a8fb3;--acc:#b794f6;--accbg:#231638;--L:#ffb74d;--E:#ff6fae;--R:#64b5f6;--U:#4db6ac;--C:#aab6c3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0914;--card:#161022;--line:#2b2040;--text:#ebe6f5;--muted:#9a8fb3;--acc:#b794f6;--accbg:#231638;--L:#ffb74d;--E:#ff6fae;--R:#64b5f6;--U:#4db6ac;--C:#aab6c3;color-scheme:dark}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;grid-column:1/-1}
.vbar .count{color:var(--muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.seg{position:relative;display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:8px;background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.seg[data-v="table"]::before{transform:translateX(100%)}
.seg button{position:relative;z-index:1;flex:1;min-width:78px;padding:6px 14px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;transition:color .2s}
.seg button:hover{color:var(--text)}.seg button.on{color:var(--acc)}
.fade{animation:krfade .3s cubic-bezier(.2,.7,.3,1)}
@keyframes krfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.seg::before{transition:none}}
.tw{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.tw table{width:100%;border-collapse:separate;border-spacing:0;font-size:.84rem}
.tw th{position:sticky;top:0;z-index:2;background:var(--card);text-align:left;font-weight:400;color:var(--muted);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tw th:first-child{border-top-left-radius:14px}.tw th:last-child{border-top-right-radius:14px}
.tw th[data-sort]{cursor:pointer;user-select:none;transition:color .15s}
.tw th[data-sort]:hover,.tw th.sorted{color:var(--acc)}
.tw .arr{display:inline-block;margin-left:6px;font-size:.6rem;opacity:0;transition:opacity .15s}
.tw th[data-sort]:hover .arr{opacity:.45}.tw th.sorted .arr{opacity:1}
.tw td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw tbody tr:last-child td{border-bottom:0}
.tw tbody tr{transition:background .15s}
.tw tbody tr:hover{background:var(--accbg)}
.tw tr[data-ore]{cursor:pointer}
.tw .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tw td.hl{color:var(--acc);background:var(--accbg)}
.sig.hl{border-color:var(--acc);color:var(--acc)}
.tw .dim{color:var(--line)}
.tw .go{width:1%;color:var(--muted);text-align:right;transition:color .15s,transform .15s}
.tw tr:hover .go{color:var(--acc)}
.tw .lname{white-space:nowrap}.tw .lname .badge{float:none;margin-left:6px}
.tw .chiprow{display:flex;flex-wrap:wrap;gap:5px;min-width:270px}.tw .chiprow .ore{margin:0}
.tw .also{color:var(--muted);font-size:.78rem;min-width:180px}
.s-Pyro{color:#cc3300!important}.s-Stanton{color:#3333ff!important}.s-Nyx{color:#66ccff!important}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--acc) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--acc);border-radius:99px;border:2px solid var(--bg)}
#sheet::-webkit-scrollbar-thumb{border-color:var(--card)}
::-webkit-scrollbar-thumb:hover{background:var(--text)}
::-webkit-scrollbar-button{display:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Space Mono",ui-monospace,Menlo,monospace}
button,input{font-family:inherit}
b,strong,h1,h2,h3{font-weight:400}
.btn,nav button,.chips button,.ore,.row,.x{transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--acc);color:var(--bg)}
nav button:hover,.chips button:hover{border-color:var(--acc);color:var(--acc)}
.ore:hover,.row:hover{background:var(--accbg)}
.x:hover{color:var(--acc)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 40px}
header{padding:20px 0 10px}
h1{margin:0;font:400 1.25rem/1.2 "Space Mono",ui-monospace,monospace;letter-spacing:.08em;color:var(--acc)}
.sub{color:var(--muted);font-size:.85rem;margin-top:4px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px}
nav button{flex:1;padding:11px 6px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;font-weight:400;font-size:.78rem;cursor:pointer}
nav button.on{color:var(--acc);border-color:var(--acc);background:var(--accbg)}
.tab{display:none}.tab.on{display:block}
input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);margin:6px 0 10px}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;font-size:.85rem}
.chips button.on{color:var(--acc);border-color:var(--acc)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0;font-size:1.15rem}
.tier{font-size:.72rem;font-weight:400;letter-spacing:.08em;text-transform:uppercase}
.sigs{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.sig{font:400 .76rem "Space Mono",ui-monospace,monospace;padding:3px 7px;border:1px solid var(--line);border-radius:6px}
.sig b{color:var(--muted);font-weight:400}
.btn{width:100%;padding:10px;border-radius:9px;border:1px solid var(--acc);background:var(--accbg);color:var(--acc);font-weight:400;cursor:pointer;font-size:.9rem}
.ore{display:inline-block;padding:3px 9px;margin:3px 3px 0 0;border-radius:99px;border:1px solid currentColor;font-size:.74rem;cursor:pointer;background:none}
.meta{color:var(--muted);font-size:.82rem}
.other{color:var(--muted);font-size:.8rem;margin-top:8px}
.badge{float:right;font-size:.7rem;padding:2px 7px;border-radius:6px;background:var(--accbg);color:var(--acc)}
.scan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.scan label{font:400 .75rem "Space Mono",ui-monospace,monospace;letter-spacing:.1em;color:var(--muted)}
.hit{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.L{color:var(--L)}.E{color:var(--E)}.R{color:var(--R)}.U{color:var(--U)}.C{color:var(--C)}.O{color:var(--muted)}
#back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
#sheet{position:fixed;top:50%;left:50%;z-index:21;width:min(92vw,520px);max-height:80vh;overflow:auto;background:var(--card);border-radius:16px;border:1px solid var(--line);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:translate(-50%,-50%) scale(.95);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
#sheet.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}#back.open{display:block}
#sheet h2{margin:0 0 2px;font-size:1.3rem}
.x{float:right;background:none;border:none;color:var(--muted);font-size:1.6rem;cursor:pointer;line-height:1}
.pct{font:400 .9rem "Space Mono",ui-monospace,monospace;color:var(--acc)}
.pct.no{color:var(--muted);font-weight:400}
.note{color:var(--muted);font-size:.78rem;margin-top:12px}
.side{display:contents}
@media (min-width:1024px){
  .wrap{max-width:1480px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;padding:0 36px 56px;align-items:start}
  .side{display:block;position:sticky;top:env(safe-area-inset-top,0px);padding-top:32px}
  header{padding:0 0 18px;border-bottom:1px solid var(--line)}
  h1{font-size:1.4rem}
  .side nav{position:static;flex-direction:column;gap:6px;padding:18px 0}
  nav button{flex:none;text-align:left;padding:12px 16px;font-size:.88rem}
  .tab.on{padding-top:32px}
  #sig.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:start}
  #sig .scan{margin:0 0 18px}#sigQ{margin:0}
  #sigGrid,#locGrid{grid-column:1/-1}
  #loc.on{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 16px;align-items:center}
  #loc .chips{margin:0}#locGrid{margin-top:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  #minQ{max-width:520px}
  #minList{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 28px}
  #sheet{width:min(92vw,580px)}
  #sigGrid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;margin-top:4px}
  #sigGrid .card{padding:22px 24px;display:flex;flex-direction:column;border-radius:16px}
  #sigGrid .card h3{font-size:1.3rem;line-height:1.3;margin-bottom:4px}
  #sigGrid .sigs{gap:8px;margin:16px 0 18px}
  #sigGrid .sig{padding:5px 10px;font-size:.8rem;border-radius:8px}
  #sigGrid .btn{margin-top:auto;padding:12px}
  #sig .scan{padding:12px 16px;border-radius:14px}
  #sig .scan input{margin:4px 0 0;padding:10px 12px}
  #scanOut:not(:empty){margin-top:8px}
  #sigQ{align-self:start}
  .tw{overflow:visible}
  #locBar{margin-top:16px}
  #locGrid{grid-template-columns:repeat(auto-fill,minmax(306px,1fr));gap:18px}
  #locGrid .card{padding:20px 22px;display:flex;flex-direction:column;border-radius:16px}
  #locGrid .card{position:relative}
  #locGrid .card .badge{position:absolute;top:21px;right:22px;float:none}
  #locGrid .card h3{font-size:1.17rem;line-height:1.3;margin-bottom:4px;padding-right:70px}
  #locGrid .card>.meta{margin-bottom:16px}
  #locGrid .card>div:not(.meta):not(.other){display:flex;flex-wrap:wrap;gap:8px}
  #locGrid .ore{margin:0;padding:4px 11px;font-size:.72rem}
  #locGrid .other{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);line-height:1.6}
  #locGrid .card>div:not(.meta):not(.other)+.other{margin-top:auto}
  #locGrid .card>div:not(.meta):not(.other){margin-bottom:16px}
}
</style>
</head>
<body>
<div class="wrap">
<aside class="side"><header><h1>⛏ KryRocks GUIDE</h1><div class="sub">Live 4.10.2 locations · signature chart · spawn rates</div></header>
<nav><button class="on" data-t="sig">Signatures</button><button data-t="loc">Locations</button><button data-t="min">Minerals</button></nav></aside>

<section id="sig" class="tab on">
<div class="scan"><label>SCAN VALUE</label>
<input id="scanIn" inputmode="numeric" placeholder="e.g. 6340  or  ~10700 (±10%)">
<div id="scanOut" class="meta"></div></div>
<div class="scan"><label>FILTER</label>
<input id="sigQ" placeholder="Ore name or tier, e.g. rare"></div>
<div class="vbar" id="sigBar"><span class="count"></span><div class="seg" data-t="sig" data-v="grid"><button data-v="grid" class="on">Tiles</button><button data-v="table">Table</button></div></div>
<div id="sigGrid" class="grid"></div>
</section>

<section id="loc" class="tab">
<input id="locQ" placeholder="Search location or ore">
<div id="sysChips" class="chips"></div>
<div class="vbar" id="locBar"><span class="count"></span><div class="seg" data-t="loc" data-v="grid"><button data-v="grid" class="on">Tiles</button><button data-v="table">Table</button></div></div>
<div id="locGrid" class="grid"></div>
</section>

<section id="min" class="tab">
<input id="minQ" placeholder="Search any resource">
<div id="minList"></div>
</section>
</div>

<div id="back"></div>
<div id="sheet" role="dialog" aria-modal="true"><button class="x" id="x" aria-label="Close">×</button><div id="sheetBody"></div></div>

const PCT={};
for(const o in RAW)RAW[o].split(";").forEach(e=>{const[l,p,d,g]=e.split(":");(PCT[o]=PCT[o]||{})[AL[l]||l]={p:+p,d:+d,g:g||o}});

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n.toLocaleString("en-US");
const cls=o=>TIER_OF[o]||"O";

// Tabs
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button,.tab").forEach(e=>e.classList.remove("on"));
  b.classList.add("on");$(b.dataset.t).classList.add("on");scrollTo(0,0);
});

// Bottom sheet
function openSheet(ore){
  const P=PCT[ore]||{};
  const rows=LOC.filter(l=>l.res.includes(ore)||P[l.name]).map(l=>({l,p:P[l.name]}))
    .sort((a,b)=>(b.p?b.p.p:-1)-(a.p?a.p.p:-1)||a.l.name.localeCompare(b.l.name));
  const t=TIER_OF[ore];
  $("sheetBody").innerHTML=`<h2 class="${cls(ore)}">${esc(ore)}</h2>
  <div class="meta">${t?TIERS[t][0]+" · ship mining":"Hand mining, ROC or harvestable"} · ${rows.length} location${rows.length==1?"":"s"}</div>
  ${rows.map(r=>`<div class="hit"><div><b>${esc(r.l.name)}</b><div class="meta"><span class="s-${r.l.sys}">${r.l.sys}</span> · ${r.l.type}${LP[r.l.name]?" · "+LP[r.l.name]:""}</div>
  ${r.p?`<div class="meta">${r.p.g==ore?"Main ore in":"Inside"} ${r.p.g} rocks (${r.p.d}%)</div>`:""}</div>
  <div class="pct ${r.p?"":"no"}">${r.p?"≤"+r.p.p+"%":"—"}</div></div>`).join("")}
  <div class="note">Max share of this ore inside its deposit group (SCMDB, 4.10.2), not weighted by how often that group spawns. “—” means not added yet.</div>`;
  $("sheet").classList.add("open");$("back").classList.add("open");
}
const closeSheet=()=>{$("sheet").classList.remove("open");$("back").classList.remove("open")};
$("x").onclick=closeSheet;$("back").onclick=closeSheet;
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("click",e=>{const o=e.target.closest("[data-ore]");if(o)openSheet(o.dataset.ore)});

// View toggle (tiles / table) + sorting
const VIEW={sig:"grid",loc:"grid"};
try{Object.assign(VIEW,JSON.parse(localStorage.getItem("kr_view")||"{}"))}catch(e){}
const SORT={sig:{k:null,d:1},loc:{k:null,d:1}};
let HL=new Set();
function syncSeg(t){const s=$(t+"Bar").querySelector(".seg");s.dataset.v=VIEW[t];
  s.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v==VIEW[t]))}
function setView(t,v){if(VIEW[t]==v)return;VIEW[t]=v;
  try{localStorage.setItem("kr_view",JSON.stringify(VIEW))}catch(e){}
  syncSeg(t);(t=="sig"?renderSig:renderLoc)(true)}
document.querySelectorAll(".seg").forEach(s=>s.onclick=e=>{const b=e.target.closest("[data-v]");if(b)setView(s.dataset.t,b.dataset.v)});
function swap(el,html,cls,anim){el.className=cls;el.innerHTML=html;
  if(anim){el.classList.remove("fade");void el.offsetWidth;el.classList.add("fade")}}
const th=(t,k,label,c="")=>{const s=SORT[t],on=s.k==k;
  return `<th data-sort="${k}" class="${on?"sorted ":""}${c}">${label}<span class="arr">${on&&s.d<0?"▼":"▲"}</span></th>`};
const sortBy=(t,list,F)=>{const s=SORT[t];if(!s.k)return list;const f=F[s.k];
  return [...list].sort((a,b)=>{const x=f(a),y=f(b);return(typeof x=="string"?x.localeCompare(y):x-y)*s.d})};
document.addEventListener("click",e=>{const h=e.target.closest("th[data-sort]");if(!h)return;
  const t=h.closest("table").dataset.t,k=h.dataset.sort,s=SORT[t];
  if(s.k!=k){s.k=k;s.d=1}else if(s.d>0)s.d=-1;else{s.k=null;s.d=1}
  (t=="sig"?renderSig:renderLoc)()});
const count=(t,n,w)=>{$(t+"Bar").querySelector(".count").textContent=n+" "+w+(n==1?"":"s")};

// Signatures
function renderSig(anim){
  const q=$("sigQ").value.toLowerCase();
  let list=SIG.filter(([n,t])=>(n+" "+TIERS[t][0]).toLowerCase().includes(q));
  count("sig",list.length,"ore");
  if(VIEW.sig=="grid"){
    swap($("sigGrid"),list.map(([n,t,b])=>{const max=TIERS[t][1];
    return `<div class="card"><h3>${n}</h3><div class="tier ${t}">${TIERS[t][0]} · up to ${max} rocks</div>
    <div class="sigs">${Array.from({length:max},(_,i)=>`<span class="sig${HL.has(n+"|"+(i+1))?" hl":""}"><b>${i+1}×</b> ${fmt(b*(i+1))}</span>`).join("")}</div>
    <button class="btn" data-ore="${n}">Where to mine</button></div>`}).join(""),"grid",anim);return}
  list=sortBy("sig",list,{name:r=>r[0],tier:r=>"LERUC".indexOf(r[1]),base:r=>r[2]});
  const html=`<div class="tw"><table data-t="sig"><thead><tr>${th("sig","name","Ore")}${th("sig","tier","Tier")}${th("sig","base","1×","num")}
  ${[2,3,4,5,6].map(i=>`<th class="num">${i}×</th>`).join("")}<th class="go"></th></tr></thead><tbody>
  ${list.map(([n,t,b])=>`<tr data-ore="${n}"><td><b class="${t}">${n}</b></td><td><span class="tier ${t}">${TIERS[t][0]}</span></td>
  ${[1,2,3,4,5,6].map(i=>`<td class="num${HL.has(n+"|"+i)?" hl":""}">${i<=TIERS[t][1]?fmt(b*i):'<span class="dim">·</span>'}</td>`).join("")}<td class="go">›</td></tr>`).join("")}
  </tbody></table></div>`;
  swap($("sigGrid"),html,"tblv",anim);
}
$("sigQ").oninput=()=>renderSig();

function scan(){
  const raw=$("scanIn").value.trim().replace(/[,\s.]/g,"");
  const done=h=>{const nh=new Set(h.filter(x=>!x.other).map(x=>x.n+"|"+x.k));
    if([...nh].join()!=[...HL].join()){HL=nh;renderSig()}};
  if(!raw){$("scanOut").innerHTML="";done([]);return}
  const approx=raw.startsWith("~"),v=parseInt(raw.replace("~",""),10);
  if(!v){$("scanOut").textContent="Enter a number.";done([]);return}
  const tol=approx?v*.1:0,hits=[];
  SIG.forEach(([n,t,b])=>{for(let k=1;k<=TIERS[t][1];k++)if(Math.abs(b*k-v)<=tol)hits.push({n,t,k,val:b*k})});
  OTHER_SIG.forEach(([n,b,m])=>{for(let k=1;k<=m;k++)if(Math.abs(b*k-v)<=tol)hits.push({n,t:"O",k,val:b*k,other:1})});
  hits.sort((a,b)=>Math.abs(a.val-v)-Math.abs(b.val-v));
  $("scanOut").innerHTML=hits.length?hits.slice(0,8).map(h=>`<div class="hit"><div><b class="${h.t}">${h.n}</b> <span class="meta">${h.k}× · ${fmt(h.val)}</span></div>
  ${h.other?"":`<button class="ore ${h.t}" data-ore="${h.n}">Where</button>`}</div>`).join(""):"No match. Try ~ for an approximate search.";
  done(hits.slice(0,8));
}
$("scanIn").oninput=scan;

// Locations
let sys="All";
$("sysChips").innerHTML=["All","Stanton","Pyro","Nyx"].map(s=>`<button class="${s==sys?"on":""} s-${s}" data-s="${s}">${s}</button>`).join("");
$("sysChips").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;sys=b.dataset.s;
  [...$("sysChips").children].forEach(c=>c.classList.toggle("on",c===b));renderLoc()};
const shipOf=l=>l.res.filter(r=>TIER_OF[r]).sort((a,b)=>"LERUC".indexOf(TIER_OF[a])-"LERUC".indexOf(TIER_OF[b]));
const chip=(o,l)=>{const p=PCT[o]&&PCT[o][l.name];return `<button class="ore ${TIER_OF[o]}" data-ore="${o}">${o}${p?" ≤"+p.p+"%":""}</button>`};
function renderLoc(anim){
  const q=$("locQ").value.toLowerCase();
  let list=LOC.filter(l=>(sys=="All"||l.sys==sys)&&(l.name+" "+l.type+" "+l.res.join(" ")).toLowerCase().includes(q));
  count("loc",list.length,"location");
  if(VIEW.loc=="grid"){
    swap($("locGrid"),list.map(l=>{const ship=shipOf(l),oth=l.res.filter(r=>!TIER_OF[r]);
    return `<div class="card">${l.salv?'<span class="badge">Salvage</span>':""}<h3>${esc(l.name)}</h3>
    <div class="meta"><span class="s-${l.sys}">${l.sys}</span> · ${l.type}${LP[l.name]?" · "+LP[l.name]:""}</div>
    <div>${ship.map(o=>chip(o,l)).join("")}</div>
    ${oth.length?`<div class="other">Also: ${oth.map(esc).join(", ")}</div>`:""}</div>`}).join(""),"grid",anim);return}
  list=sortBy("loc",list,{name:l=>l.name,sys:l=>l.sys,type:l=>l.type,best:l=>{const s=shipOf(l);return s.length?"LERUC".indexOf(TIER_OF[s[0]]):9}});
  const html=`<div class="tw"><table data-t="loc"><thead><tr>${th("loc","name","Location")}${th("loc","sys","System")}${th("loc","type","Type")}${th("loc","best","Ship ores")}<th>Also</th></tr></thead><tbody>
  ${list.map(l=>{const oth=l.res.filter(r=>!TIER_OF[r]);
    return `<tr><td class="lname">${esc(l.name)}${l.salv?' <span class="badge">Salvage</span>':""}${LP[l.name]?`<div class="meta">${LP[l.name]}</div>`:""}</td>
    <td><span class="s-${l.sys}">${l.sys}</span></td><td class="meta">${l.type}</td>
    <td><div class="chiprow">${shipOf(l).map(o=>chip(o,l)).join("")}</div></td>
    <td class="also">${oth.length?oth.map(esc).join(", "):'<span class="dim">·</span>'}</td></tr>`}).join("")}
  </tbody></table></div>`;
  swap($("locGrid"),html,"tblv",anim);
}
$("locQ").oninput=()=>renderLoc();
syncSeg("sig");syncSeg("loc");

// Minerals (all resources)
const RANK=o=>{const t=TIER_OF[o];return t?"LERUC".indexOf(t):5};
const ALL=[...new Set(LOC.flatMap(l=>l.res))].sort((a,b)=>RANK(a)-RANK(b)||a.localeCompare(b));
function renderMin(){
  const q=$("minQ").value.toLowerCase();
  $("minList").innerHTML=ALL.filter(n=>n.toLowerCase().includes(q)).map(n=>{
    const c=LOC.filter(l=>l.res.includes(n)).length,t=TIER_OF[n];
    return `<div class="row" data-ore="${esc(n)}"><div><b class="${cls(n)}">${esc(n)}</b><div class="meta">${t?TIERS[t][0]+" · ship":"Hand / ROC / harvest"}</div></div><span class="meta">${c} location${c==1?"":"s"} ›</span></div>`}).join("");
}
$("minQ").oninput=renderMin;

renderSig();renderLoc();renderMin();
</script>
